<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaProfile</title><script src="/Nova_Profile/config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#050507;color:#fff;font-family:Inter,system-ui,Arial}body{overflow:hidden}.bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#08080b center/cover no-repeat;overflow:hidden}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.34);z-index:1}.bgvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.card{position:relative;z-index:2;width:min(590px,calc(100% - 30px));padding:32px 28px;text-align:center;background:rgba(15,15,21,.76);border:1px solid rgba(255,255,255,.13);border-radius:24px;backdrop-filter:blur(18px);box-shadow:0 25px 100px #000;transition:.25s}.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#171720;border:2px solid rgba(255,255,255,.18);display:block;margin:0 auto}.name{font-size:clamp(28px,6vw,42px);font-weight:900;line-height:1.05;margin:15px 0 8px}.bio{color:#b0b0ba;line-height:1.6;font-size:15px;white-space:pre-wrap;word-break:break-word}.music{margin:22px auto 0;max-width:420px;padding:14px 16px;border-radius:14px;background:#ffffff09;border:1px solid #ffffff10;text-align:left}.music b{font-size:14px}.music small{display:block;color:#888;margin-top:3px}.music button{margin-top:10px;padding:8px 11px;border:0;border-radius:9px;background:#765cf5;color:#fff;font-weight:700;cursor:pointer}.enter{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#050507 center/cover no-repeat;cursor:pointer;transition:opacity .65s ease}.enter:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}.enterbox{position:relative;z-index:2;text-align:center;padding:25px}.enterbox b{font-size:clamp(20px,4vw,28px)}.enterbox small{display:block;color:#aaa;margin-top:8px}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;background:#111118ee;border:1px solid #ffffff14;padding:9px 12px;border-radius:9px;color:#aaa;display:none}
</style></head><body>
<main class="bg" id="bg"><video class="bgvideo" id="bgVideo" muted autoplay loop playsinline></video><section class="card" id="card"><img class="avatar" id="avatar" alt="Profilbild"><div class="name" id="name">Profil wird geladen…</div><div class="bio" id="bio"></div><div class="music" id="music" style="display:none"><b id="song"></b><small id="artist"></small><button id="play">▶ Musik abspielen</button></div></section></main>
<div class="enter" id="enter"><div class="enterbox"><b id="enterText">click to enter...</b><small id="enterSub">welcome to my profile</small></div></div><div class="status" id="status"></div>
<script>
const $=id=>document.getElementById(id);let data=null,preview='',audio=null;
function status(t){$('status').textContent=t;$('status').style.display='block';setTimeout(()=>$('status').style.display='none',2600)}
function usernameFromPath(){
 const params=new URLSearchParams(location.search);const legacy=params.get('u');if(legacy)return legacy;
 const base='/Nova_Profile/';let path=location.pathname;const i=path.indexOf(base);if(i>=0)path=path.slice(i+base.length);path=path.replace(/^\/+|\/+$/g,'');if(path==='profile.html'||path==='404.html'||path==='')return 'yourname';if(path.startsWith('@'))path=path.slice(1);return decodeURIComponent(path).split('/')[0].toLowerCase();
}
async function init(){const u=usernameFromPath();try{if(!window.NOVA_SUPABASE_URL||window.NOVA_SUPABASE_URL.includes('DEINE_')){showMissing(u);return}const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const sb=m.createClient(window.NOVA_SUPABASE_URL,window.NOVA_SUPABASE_ANON_KEY);const r=await sb.from('profiles').select('*').eq('username',u).maybeSingle();if(r.error)throw r.error;if(!r.data){showMissing(u);return}data=r.data;render();sb.rpc('increment_profile_views',{p_username:u});}catch(e){console.error(e);$('name').textContent='Profil konnte nicht geladen werden';$('bio').textContent='Bitte später erneut versuchen.'}}
function showMissing(u){$('name').textContent='@'+u;$('bio').textContent='Dieses Profil wurde noch nicht erstellt.';$('enterText').textContent='NovaProfile';$('enterSub').textContent='Kein Profil gefunden';}
function render(){
 document.title=(data.name||data.username)+' — NovaProfile';$('name').textContent=data.name||data.username;$('bio').textContent=data.bio||'';if(data.avatar)$('avatar').src=data.avatar;else $('avatar').style.display='none';
 document.documentElement.style.setProperty('--accent',data.accent||'#765cf5');$('card').style.background=`rgba(15,15,21,${Math.max(.1,Math.min(1,(data.opacity??76)/100))})`;$('card').style.borderRadius=(data.radius??24)+'px';$('card').style.backdropFilter=data.glass===false?'none':`blur(${data.blur??18}px)`;if(data.glow)$('card').style.boxShadow=`0 25px 100px #000,0 0 70px ${(data.accent||'#765cf5')}45`;
 $('bg').style.backgroundColor=data.bg_color||'#08080b';if(data.bg_mode==='video'&&data.video_url){$('bgVideo').src=data.video_url;$('bgVideo').style.display='block';$('bg').style.backgroundImage='none'}else if(data.bg_mode==='image'&&data.bg_url){$('bg').style.backgroundImage=`url("${data.bg_url.replaceAll('"','')}")`}
 $('enterText').textContent=data.enter_text||'click to enter...';$('enterSub').textContent=data.enter_sub||'welcome to my profile';$('enter').style.backgroundImage=data.bg_url?`url("${data.bg_url.replaceAll('"','')}")`:'';
 if(data.song||data.artist){$('music').style.display='block';$('song').textContent=data.song||'Untitled';$('artist').textContent=data.artist||'';searchPreview(data.song||'',data.artist||'')}
}
async function searchPreview(s,a){try{const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(s+' '+a)+'&entity=song&limit=5&country=DE');const j=await r.json();const x=(j.results||[]).find(z=>z.previewUrl);if(x)preview=x.previewUrl}catch(e){console.warn(e)}}
$('play').onclick=()=>{if(!preview){status('Für diesen Titel ist keine Preview verfügbar.');return}if(audio){audio.pause();audio.currentTime=0}audio=new Audio(preview);audio.volume=Math.max(0,Math.min(1,(data?.volume??70)/100));audio.loop=data?.audio_loop==='yes';audio.play().then(()=>status('Musik läuft ✓')).catch(()=>status('Browser hat die Wiedergabe blockiert.'))};
$('enter').onclick=()=>{if(preview&&!audio){audio=new Audio(preview);audio.volume=Math.max(0,Math.min(1,(data?.volume??70)/100));audio.loop=data?.audio_loop==='yes';audio.play().catch(()=>{})}$('enter').style.opacity='0';$('enter').style.pointerEvents='none';setTimeout(()=>$('enter').remove(),650)};init();
</script></body></html>
